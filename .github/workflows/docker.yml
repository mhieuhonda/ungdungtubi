# ────────────────────────────────────────────────────────────────────────────
# GitHub Actions — Build & Push Docker Image, Trigger Coolify Webhook
# Ứng Dụng Từ Bi (Rust 1.97.1)
#
# Trigger: push tag `v*` hoặc thủ công từ Actions tab
# Image: ghcr.io/mhieuhonda/ungdungtubi:<tag>
# Sau khi push image, gọi Coolify webhook để Coolify tự pull image mới + redeploy
# ────────────────────────────────────────────────────────────────────────────
name: Build, Push & Deploy

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'src/**'
      - 'templates/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag image (mặc định: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mhieuhonda/ungdungtubi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: 🏗️ Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📊 Output image digest
        run: |
          echo "✅ Image pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  - /'
          echo "Digest: ${{ steps.meta.outputs.digest }}"

  trigger-coolify:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}

    steps:
      - name: 🚀 Trigger Coolify Webhook (skip if not configured)
        if: env.COOLIFY_WEBHOOK_URL != ''
        run: |
          echo "📡 Gọi Coolify webhook để trigger deploy..."
          RESPONSE=$(curl -sS -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            --max-time 30 || echo "curl-failed")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "Response body: $BODY"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Coolify webhook đã nhận. Coolify sẽ tự pull image mới và deploy."
          else
            echo "⚠️ Coolify webhook trả về HTTP $HTTP_CODE — cần kiểm tra webhook URL."
            exit 1
          fi

      - name: ℹ️ Skip Coolify trigger (no webhook URL configured)
        if: env.COOLIFY_WEBHOOK_URL == ''
        run: |
          echo "ℹ️  COOLIFY_WEBHOOK_URL secret chưa được cấu hình."
          echo "    Image đã được push lên GHCR — Coolify sẽ deploy theo lịch nếu đã set auto-deploy."
          echo "    Để setup webhook tự động: Settings → Secrets → Add COOLIFY_WEBHOOK_URL"
