# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions — Ứng Dụng Từ Bi v0.9.27
# Build & push Docker image (Rust 1.97.1) lên GHCR, sau đó TỰ ĐỘNG cập nhật
# Dockerfile.coolify với SHA tag mới + gọi Coolify API để trigger deploy.
#
# v0.9.26 FIX (CRITICAL — Deploy pipeline):
#   Trước v0.9.26, deploy pipeline dùng 2-commit pattern:
#     1. Code commit X (code change) → workflow build image `sha-X` → trigger Coolify
#     2. Coolify clones repo → đọc Dockerfile.coolify từ commit X
#        (vẫn ghi `FROM sha-PREVIOUS`) → pull `sha-PREVIOUS` → deploy OLD code
#     3. Developer phải push commit X+1 manual để update Dockerfile.coolify → `FROM sha-X`
#     4. Coolify deploy lại → lần này mới chạy code mới
#   → "Deploy thành công nhưng production vẫn y như cũ" là bug này.
#
#   Fix v0.9.26: Workflow tự update Dockerfile.coolify trong cùng workflow
#   ngay sau khi build image xong, trước khi trigger Coolify.
#   → Coolify đọc Dockerfile.coolify mới → pull đúng image mới → deploy đúng code.
#   → Single-commit pattern: developer chỉ cần push 1 commit, deploy tự động đúng.
#
# Quy trình v0.9.26:
#   1. Push code lên branch `main` (hoặc tạo tag `v*`)
#   2. Workflow build multi-stage Docker image với Rust 1.97.1-slim-bookworm
#   3. Push image lên GHCR: ghcr.io/mhieuhonda/tubi-app:{latest, sha, tag}
#   4. Workflow tự update Dockerfile.coolify → `FROM sha-<NEW_SHA>`
#   5. Workflow commit + push Dockerfile.coolify update (skip ci để tránh loop)
#   6. Workflow gọi Coolify API /start → Coolify pull Dockerfile.coolify mới → deploy
#
# Image name: `ghcr.io/mhieuhonda/tubi-app` (đổi từ `ungdungtubi` sang `tubi-app`
#   để tránh conflict với GHCR package cũ `ungdungtubi` đã tồn tại từ project khác,
#   không linked với repo này nên GITHUB_TOKEN không có quyền push → 403 Forbidden).
#
# Secrets cần thiết (Settings → Secrets and variables → Actions):
#   - COOLIFY_API_TOKEN    : API token của Coolify (tạo ở User Settings → API Tokens)
#   - COOLIFY_APP_UUID     : UUID của application trên Coolify (= xsrqp8xrcwwk57dvtcwt6393)
#   - GH_PAT               : Personal Access Token của bot để push Dockerfile.coolify update
#                           (cần contents:write permission; GITHUB_TOKEN không có quyền
#                            trigger workflow tiếp theo nhưng có quyền push commit thường)
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Quyền cần thiết: ghi package lên GHCR, đọc contents repo
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # Image name cố định `mhieuhonda/tubi-app` (không dùng ${{ github.repository }}
  # để tránh conflict với GHCR package cũ `ungdungtubi` không linked với repo).
  IMAGE_NAME: mhieuhonda/tubi-app
  COOLIFY_API_URL: https://coolify.buppou.com

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false   # không cancel build đang chạy (có thể đang deploy)

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build & push Docker image lên GHCR
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}
      sha_tag: ${{ steps.sha_tag.outputs.sha_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute SHA tag (short)
        id: sha_tag
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "sha_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "SHA Tag will be: sha-${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.16.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-,enable=true
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Ứng Dụng Từ Bi
            org.opencontainers.image.description=Rust 1.97.1 + Axum 0.8 web app — Cộng Đồng Từ Bi
            org.opencontainers.image.source=https://github.com/mhieuhonda/ungdungtubi
            org.opencontainers.image.licenses=MIT

      - name: Build & push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Summary
        run: |
          {
            echo "### Docker Image pushed to GHCR 🪷"
            echo ""
            echo "- Image: \`ghcr.io/mhieuhonda/tubi-app\`"
            echo "- Tags:"
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  - /'
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Source SHA: \`${{ github.sha }}\`"
            echo "- Short SHA tag: \`${{ steps.sha_tag.outputs.sha_tag }}\`"
          } >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Update Dockerfile.coolify với SHA tag mới — CRITICAL FIX v0.9.26
  # ──────────────────────────────────────────────────────────────────────────
  # Trước v0.9.26: Workflow chỉ build image + trigger Coolify deploy.
  # Nhưng Dockerfile.coolify vẫn trỏ tới SHA tag cũ → Coolify pull old image
  # → "deploy thành công nhưng production không đổi".
  #
  # Fix: Workflow tự update Dockerfile.coolify → `FROM sha-<NEW_SHA>` và commit.
  # Commit message chứa [skip ci] để không trigger workflow mới (tránh loop).
  # ──────────────────────────────────────────────────────────────────────────
  update-coolify-dockerfile:
    name: Update Dockerfile.coolify SHA tag
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Dùng GITHUB_TOKEN để push commit (đã có permissions: contents: write)
          # token mặc định đủ quyền push branch nếu workflow có permission write
          fetch-depth: 0

      - name: Update Dockerfile.coolify với SHA tag mới
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          set -euo pipefail
          echo "→ Updating Dockerfile.coolify to FROM ghcr.io/mhieuhonda/tubi-app:${SHA_TAG}"

          # Replace dòng FROM ... bằng SHA tag mới
          # Dùng perl để hỗ trợ regex thay vì sed (sed trên macOS khác Linux)
          perl -i -pe "s|^FROM ghcr\.io/mhieuhonda/tubi-app:[^\\s]+|FROM ghcr.io/mhieuhonda/tubi-app:${SHA_TAG}|" Dockerfile.coolify

          echo "→ Dockerfile.coolify sau khi update:"
          tail -5 Dockerfile.coolify

          # Check xem có thay đổi không
          if git diff --quiet Dockerfile.coolify; then
            echo "ℹ️  Dockerfile.coolify đã có SHA tag đúng — không cần commit."
            echo "needs_update=false" >> $GITHUB_ENV
          else
            echo "✅ Dockerfile.coolify cần update."
            echo "needs_update=true" >> $GITHUB_ENV
          fi

      - name: Commit + push Dockerfile.coolify update
        if: env.needs_update == 'true'
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile.coolify
          # [skip ci] để không trigger workflow mới — tránh infinite loop
          git commit -m "chore(deploy): bump Dockerfile.coolify → ${SHA_TAG} [skip ci]"
          # v0.9.27 FIX: Push về origin main cụ thể thay vì git push (bị detached HEAD).
          # actions/checkout@v4 tạo detached HEAD → "git push" fail với
          # "fatal: You are not currently on a branch".
          # Fix: push HEAD đến remote branch main cụ thể.
          git push origin HEAD:refs/heads/main

      - name: Summary
        if: env.needs_update == 'true'
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          {
            echo "### Dockerfile.coolify updated 🪷"
            echo ""
            echo "- Updated to: \`FROM ghcr.io/mhieuhonda/tubi-app:${SHA_TAG}\`"
            echo "- Committed with \`[skip ci]\` to avoid workflow loop"
            echo "- Coolify will pull the new Dockerfile.coolify + the new image on deploy"
          } >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Trigger Coolify deploy — gọi API /start để Coolify pull image mới
  # Chạy SAU khi Dockerfile.coolify đã được update (dependency: update-coolify-dockerfile)
  # ──────────────────────────────────────────────────────────────────────────
  trigger-coolify:
    name: Trigger Coolify Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push, update-coolify-dockerfile]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Wait for GHCR propagation (10s)
        run: sleep 10

      - name: Call Coolify API /start
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_API_TOKEN}" ]; then
            echo "::error::Secret COOLIFY_API_TOKEN is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${COOLIFY_APP_UUID}" ]; then
            echo "::error::Secret COOLIFY_APP_UUID is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          URL="${COOLIFY_API_URL}/api/v1/applications/${COOLIFY_APP_UUID}/start"
          echo "→ Calling Coolify API: $URL"

          # v0.9.27 FIX: Coolify v4 /start endpoint cần POST, không phải GET
          HTTP_CODE=$(curl -sS -o /tmp/coolify_resp.json -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${URL}")

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response:"
          cat /tmp/coolify_resp.json
          echo

          # Coolify trả về 200 khi deploy được xếp hàng thành công
          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ] || [ "${HTTP_CODE}" = "202" ]; then
            DEPLOY_UUID=$(python3 -c "import json,sys; print(json.load(open('/tmp/coolify_resp.json')).get('deployment_uuid',''))" 2>/dev/null || echo "")
            echo "✅ Deployment queued — deployment_uuid=$DEPLOY_UUID"
            if [ -n "$DEPLOY_UUID" ]; then
              echo "deploy_uuid=$DEPLOY_UUID" >> $GITHUB_OUTPUT
            fi
          else
            echo "::error::Coolify API returned HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Coolify Deploy Triggered 🚀"
            echo ""
            echo "Coolify will now:"
            echo "1. Pull the latest code from \`main\` (includes updated Dockerfile.coolify)"
            echo "2. Build Dockerfile.coolify → pulls \`ghcr.io/mhieuhonda/tubi-app:sha-<NEW_SHA>\`"
            echo "3. Stop the old container"
            echo "4. Start a new container with the new image"
            echo "5. Run health checks on https://tubi.louis.vangioitutien.com/api/health"
            echo ""
            echo "Watch the deployment at: https://coolify.buppou.com/project/o11iuvcvbs5394dxxchp4w4c"
          } >> $GITHUB_STEP_SUMMARY
