<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- ═══════════════════════════════════════════════════════════════════════
       Ứng Dụng Từ Bi — Logo Hoa Sen 🪷 (Full Size)
       v0.9.31 — Giai đoạn 36: Redesign logo thành hoa sen trên bàn phím 🪷
       Phong cách: hoa sen cách điệu, tối giản, thanh lịch
       Màu: tubi-700 (#2E7D32) + tubi-500 (#4CAF50) + amber (#FFB300)
       ═══════════════════════════════════════════════════════════════════════ -->
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="50%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <linearGradient id="petalInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>

  <!-- Nước / nền dưới (ellipse nhẹ) -->
  <ellipse cx="64" cy="100" rx="36" ry="6" fill="#C8E6C9" opacity="0.4"/>

  <!-- Cánh sen ngoài — 5 cánh chính -->
  <!-- Cánh giữa (trên) -->
  <path d="M64 28 C58 38, 52 52, 52 62 C52 72, 58 78, 64 78 C70 78, 76 72, 76 62 C76 52, 70 38, 64 28Z"
        fill="url(#petalGrad)" stroke="#388E3C" stroke-width="0.5"/>

  <!-- Cánh trái-1 -->
  <path d="M64 34 C52 36, 38 46, 34 56 C30 66, 36 76, 46 78 C52 79, 58 74, 62 68 C60 58, 60 46, 64 34Z"
        fill="url(#petalGrad)" stroke="#388E3C" stroke-width="0.5"/>

  <!-- Cánh phải-1 -->
  <path d="M64 34 C76 36, 90 46, 94 56 C98 66, 92 76, 82 78 C76 79, 70 74, 66 68 C68 58, 68 46, 64 34Z"
        fill="url(#petalGrad)" stroke="#388E3C" stroke-width="0.5"/>

  <!-- Cánh trái-2 (ngoài) -->
  <path d="M64 42 C48 42, 32 50, 28 60 C24 70, 32 80, 44 82 C50 82, 56 76, 60 70 C58 62, 60 50, 64 42Z"
        fill="url(#petalGrad)" stroke="#388E3C" stroke-width="0.5" opacity="0.85"/>

  <!-- Cánh phải-2 (ngoài) -->
  <path d="M64 42 C80 42, 96 50, 100 60 C104 70, 96 80, 84 82 C78 82, 72 76, 68 70 C70 62, 68 50, 64 42Z"
        fill="url(#petalGrad)" stroke="#388E3C" stroke-width="0.5" opacity="0.85"/>

  <!-- Cánh trong — 3 cánh nhỏ hơn, sáng hơn -->
  <!-- Cánh trong giữa -->
  <path d="M64 36 C60 42, 56 52, 56 60 C56 68, 60 72, 64 72 C68 72, 72 68, 72 60 C72 52, 68 42, 64 36Z"
        fill="url(#petalInner)" stroke="none"/>

  <!-- Cánh trong trái -->
  <path d="M64 40 C56 42, 46 48, 44 56 C42 64, 48 72, 54 72 C58 72, 62 68, 64 64 C62 56, 62 46, 64 40Z"
        fill="url(#petalInner)" stroke="none"/>

  <!-- Cánh trong phải -->
  <path d="M64 40 C72 42, 82 48, 84 56 C86 64, 80 72, 74 72 C70 72, 66 68, 64 64 C66 56, 66 46, 64 40Z"
        fill="url(#petalInner)" stroke="none"/>

  <!-- Tâm hoa sen (nhụy) -->
  <circle cx="64" cy="62" r="8" fill="url(#centerGrad)"/>
  <circle cx="64" cy="62" r="4" fill="#FFF8E1" opacity="0.6"/>

  <!-- Chấm nhụy nhỏ -->
  <circle cx="60" cy="59" r="1.5" fill="#FF6F00" opacity="0.7"/>
  <circle cx="68" cy="59" r="1.5" fill="#FF6F00" opacity="0.7"/>
  <circle cx="64" cy="65" r="1.5" fill="#FF6F00" opacity="0.7"/>
  <circle cx="56" cy="63" r="1" fill="#FF6F00" opacity="0.5"/>
  <circle cx="72" cy="63" r="1" fill="#FF6F00" opacity="0.5"/>
</svg>
