<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo đầy đủ — Ứng Dụng Từ Bi (v0.9.33 — Giai đoạn 38)
  Emoji 🪷 lotus — sharpened render (256×256 viewBox, geometricPrecision)
  File này được dùng cho hero home + og:image (khi cần).
  Giữ nguyên emoji 🪷 — chỉ tối ưu render để nét hơn.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     shape-rendering="geometricPrecision">
  <text x="128" y="128"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, Twemoji Mozilla, EmojiOne Color, system-ui, sans-serif"
        font-size="240"
        text-anchor="middle"
        dominant-baseline="central"
        text-rendering="geometricPrecision">🪷</text>
</svg>
