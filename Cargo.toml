[package]
name = "ungdungtubi"
version = "0.9.10"
edition = "2024"
rust-version = "1.97"

[dependencies]
# Web framework ( migrated from actix-web 4 → axum 0.8 )
# v0.9.3: thêm feature "ws" cho Live Chat WebSocket trong nhóm + Chat Chung toàn platform
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "cors"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "json"] }

# Templates
askama = "0.14"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Environment & Config
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"

# HTTP client (Google OAuth token exchange + userinfo)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# URL encoding for OAuth params
urlencoding = "2"

# Random OAuth state
rand = "0.8"

# Hashing (checksum for uploaded files + audit)
sha2 = "0.10"

# Byte handling for multipart uploads
bytes = "1"

# Mime type sniffing for upload validation
mime = "0.3"

# Async utilities
futures-util = "0.3"

# Tokio runtime
tokio = { version = "1", features = ["full"] }

# Time crate (used by cookie 0.18 for SignedDuration in max_age)
time = "0.3"

[profile.release]
# Optimise for smaller Docker image and faster runtime
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
