[package]
name = "ungdungtubi"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
# Web framework
actix-web = "4"
actix-files = "0.6"
actix-rt = "2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }

# Templates
askama = "0.14"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Environment & Config
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"

# Password hashing
argon2 = "0.5"
