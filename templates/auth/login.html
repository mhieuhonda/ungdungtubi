{% extends "layout.html" %}

{% block title %}Đăng Nhập — Ứng Dụng Từ Bi{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16"
         x-data="{ email: '', password: '' }">
    <div class="bg-white rounded-2xl p-8 shadow-lg">
        <div class="text-center mb-8">
            <span class="text-4xl">🪷</span>
            <h1 class="text-2xl font-bold text-tubi-800 mt-2">Đăng Nhập</h1>
            <p class="text-gray-500 text-sm mt-1">Vào Không Gian của bạn</p>
        </div>
        
        {% if let Some(e) = error %}
        <div class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
            {{ e }}
        </div>
        {% endif %}
        
        <form hx-post="/dang-nhap" hx-swap="innerHTML" hx-target="#login-form"
              id="login-form">
            <!-- Email -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" x-model="email" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-tubi-500 focus:border-tubi-500 transition">
            </div>
            
            <!-- Mật khẩu -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật Khẩu</label>
                <input type="password" name="password" x-model="password" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-tubi-500 focus:border-tubi-500 transition">
            </div>
            
            <button type="submit"
                    class="w-full bg-tubi-800 hover:bg-tubi-700 text-white py-3 rounded-xl font-semibold transition-colors shadow-md">
                🪷 Đăng Nhập
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            Chưa có tài khoản? 
            <a href="/dang-ky" class="text-tubi-600 hover:text-tubi-800 font-medium">Tham Gia</a>
        </p>
    </div>
</section>
{% endblock %}
